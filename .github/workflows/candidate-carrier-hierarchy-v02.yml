name: Candidate carrier hierarchy v0.2

on:
  push:
    branches:
      - candidate/600cell-working-layer-v0.1-20260911-v02
    paths:
      - 'TIR/validation/validate_carrier_hierarchy_v02.py'
      - '.github/workflows/candidate-carrier-hierarchy-v02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-carrier-hierarchy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated dependencies
        run: python -m pip install --upgrade numpy
      - name: Run independent carrier hierarchy validator
        run: python TIR/validation/validate_carrier_hierarchy_v02.py
