name: TIR semantic U1 holonomy v0.1

on:
  pull_request:
    branches: [main]
    paths:
      - 'TIR/foundations/TIR_WIJ_SEMANTIC_U1_HOLONOMY_FROM_A_V0_1.md'
      - 'TIR/validation/tir_wij_semantic_u1_holonomy_from_a_v0_1.py'
      - 'TIR/provenance/TIR_WIJ_SEMANTIC_U1_HOLONOMY_FROM_A_V0_1.json'
      - '.github/workflows/tir-semantic-u1-holonomy-v01.yml'

permissions:
  contents: read

jobs:
  semantic-u1-holonomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator
        run: python -m py_compile TIR/validation/tir_wij_semantic_u1_holonomy_from_a_v0_1.py
      - name: Run deterministic semantic U1 holonomy validator
        run: python TIR/validation/tir_wij_semantic_u1_holonomy_from_a_v0_1.py
