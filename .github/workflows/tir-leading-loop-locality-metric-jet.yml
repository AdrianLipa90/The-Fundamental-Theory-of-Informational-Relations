name: TIR leading-loop locality metric-jet gate

on:
  pull_request:
    paths:
      - 'TIR/foundations/TIR_LEADING_LOOP_LOCALITY_METRIC_JET_V0_1.md'
      - 'TIR/foundations/validation/tir_leading_loop_locality_metric_jet_v0_1.py'
      - 'TIR/foundations/validation/TIR_LEADING_LOOP_LOCALITY_METRIC_JET_V0_1.json'
      - '.github/workflows/tir-leading-loop-locality-metric-jet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-leading-loop-locality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run leading-loop locality / metric-jet gate
        run: python TIR/foundations/validation/tir_leading_loop_locality_metric_jet_v0_1.py
