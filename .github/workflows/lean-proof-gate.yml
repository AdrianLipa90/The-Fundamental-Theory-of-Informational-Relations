name: Lean proof gate

on:
  pull_request:
    branches: ["main"]
    paths:
      - "Formal.lean"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean-proof-gate.yml"
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          leanchecker: true
          leanchecker-args: "Formal"
          axiom-audit: true
          axiom-audit-root: Formal
          use-github-cache: true
