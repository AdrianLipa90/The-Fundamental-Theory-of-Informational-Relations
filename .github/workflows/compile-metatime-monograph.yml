name: Compile Metatime monograph

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-monograph:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact branch head revision
        uses: actions/checkout@v4
        with:
          ref: agent/collatz-quarter-power-scaling
          fetch-depth: 1

      - name: Verify initial checkout provenance
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Normalize monograph references and layout
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/monograph/normalize_build_sources.py
          sed -i 's/\\usepackage{microtype}/\\usepackage[protrusion=true,expansion=false]{microtype}/' TIR/monograph/metatime_monograph.tex
          git diff --check

      - name: Commit normalized LaTeX sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TIR/monograph
          if git diff --cached --quiet; then
            echo "No source normalization changes required."
          else
            git commit -m "docs: fix monograph references and layout warnings"
            git push origin HEAD:agent/collatz-quarter-power-scaling
          fi

      - name: Record final checkout provenance
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee checkout_head_sha.txt
          git status --short --branch | tee checkout_status.txt

      - name: Install LaTeX toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            poppler-utils

      - name: Compile monograph
        shell: bash
        working-directory: TIR/monograph
        run: |
          set -o pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error metatime_monograph.tex 2>&1 | tee compile-console.log

      - name: Verify PDF and warnings
        shell: bash
        run: |
          set -euo pipefail
          test -s TIR/monograph/metatime_monograph.pdf
          pdfinfo TIR/monograph/metatime_monograph.pdf | tee pdfinfo.txt
          sha256sum TIR/monograph/metatime_monograph.pdf | tee metatime_monograph.pdf.sha256
          ! grep -Eq "undefined references|Reference .* undefined|Citation .* undefined" TIR/monograph/metatime_monograph.log
          ! grep -q "Overfull \\hbox" TIR/monograph/metatime_monograph.log

      - name: Upload compiled monograph and logs
        uses: actions/upload-artifact@v4
        with:
          name: metatime-monograph-pr77-final
          if-no-files-found: error
          retention-days: 30
          path: |
            TIR/monograph/metatime_monograph.pdf
            TIR/monograph/metatime_monograph.log
            TIR/monograph/compile-console.log
            checkout_head_sha.txt
            checkout_status.txt
            pdfinfo.txt
            metatime_monograph.pdf.sha256
