name: Compile TIR and critical-axis monographs

on:
  push:
    branches:
      - agent/inverse-holonomy-critical-axis-v0.2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify checkout provenance
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git rev-parse HEAD | tee checkout_head_sha.txt
          git status --short --branch | tee checkout_status.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test critical-axis solver and numerical core
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "TIR/zeta_information_axis[test]"
          pytest TIR/zeta_information_axis/tests -q | tee critical-axis-pytest.log
          python TIR/zeta_information_axis/scripts/run_audit.py
          python TIR/zeta_information_axis/scripts/solve_axis.py --output TIR/zeta_information_axis/reports/solver_receipt.json > solver-console.json
          grep -q '"half_axis_consensus": true' TIR/zeta_information_axis/reports/solver_receipt.json
          grep -q '"rh_derived": false' TIR/zeta_information_axis/reports/solver_receipt.json

      - name: Prepare publication candidate sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSYNTAX'
          from pathlib import Path
          for filename in (
              'TIR/monograph/prepare_publication_candidate_v11_0.py',
              'TIR/monograph/prepare_publication_candidate_v11_0_impl.py',
              'TIR/zeta_information_axis/src/critical_axis/solver.py',
              'TIR/zeta_information_axis/scripts/solve_axis.py',
          ):
              source = Path(filename).read_text(encoding='utf-8')
              compile(source, filename, 'exec')
              print(f'SYNTAX PASS: {filename}')
          PYSYNTAX
          python3 TIR/monograph/normalize_build_sources.py
          PYTHONDONTWRITEBYTECODE=1 python3 TIR/monograph/prepare_publication_candidate_v11_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 TIR/monograph/add_citation_context_v10_9.py
          rm -rf TIR/monograph/__pycache__ || true
          find TIR/zeta_information_axis -type d -name __pycache__ -prune -exec rm -rf {} + || true
          git diff --check

      - name: Install publication toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            texlive-xetex \
            poppler-utils \
            qpdf

      - name: Compile parent Metatime monograph
        shell: bash
        working-directory: TIR/monograph
        run: |
          set -o pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error metatime_monograph.tex 2>&1 | tee compile-console.log

      - name: Compile critical-axis monograph
        shell: bash
        working-directory: TIR/zeta_information_axis/monograph
        run: |
          set -o pipefail
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex 2>&1 | tee compile-console.log

      - name: Publication preflight
        shell: bash
        run: |
          set -euo pipefail
          PARENT=TIR/monograph/metatime_monograph.pdf
          PARENT_LOG=TIR/monograph/metatime_monograph.log
          AXIS=TIR/zeta_information_axis/monograph/main.pdf
          AXIS_LOG=TIR/zeta_information_axis/monograph/main.log

          test -s "$PARENT"
          test -s "$AXIS"
          test -s TIR/monograph/CITATION_COVERAGE_v11_0.md
          test -s TIR/monograph/citation_coverage_v11_0.json
          test -s TIR/monograph/PUBLICATION_READINESS_v11_0.md
          test -s TIR/monograph/publication_readiness_v11_0.json
          test -s TIR/zeta_information_axis/reports/solver_receipt.json
          grep -q "TECHNICAL PASS - LOCAL CITATION COVERAGE COMPLETE" TIR/monograph/CITATION_COVERAGE_v11_0.md
          grep -q '"neutron_edm": "FAIL"' TIR/monograph/publication_readiness_v11_0.json
          grep -q '5.3299' TIR/monograph/chapters/ch25_strong_cp_angle.tex
          grep -q '2.96' TIR/monograph/chapters/ch26_neutron_edm.tex
          ! grep -R -q "All 26 SM Parameters" TIR/monograph/chapters TIR/monograph/appendices TIR/monograph/frontmatter
          ! grep -R -q "Mean absolute error across all 26" TIR/monograph/chapters TIR/monograph/appendices TIR/monograph/frontmatter
          ! grep -Eq "undefined references|Reference .* undefined|Citation .* undefined" "$PARENT_LOG"
          ! grep -Eq "undefined references|Reference .* undefined|Citation .* undefined" "$AXIS_LOG"
          ! grep -q "Overfull \\hbox" "$PARENT_LOG"
          ! grep -q "Overfull \\hbox" "$AXIS_LOG"
          ! grep -Eq "multiply defined|multiply-defined" "$PARENT_LOG"
          ! grep -Eq "multiply defined|multiply-defined" "$AXIS_LOG"

          pdfinfo "$PARENT" | tee parent-pdfinfo.txt
          pdfinfo "$AXIS" | tee axis-pdfinfo.txt
          python3 - <<'PYPAGES'
          from pathlib import Path
          import re
          def pages(path):
              text = Path(path).read_text(encoding='utf-8')
              match = re.search(r'^Pages:\s+(\d+)$', text, re.MULTILINE)
              if not match:
                  raise SystemExit(f'No page count in {path}')
              return int(match.group(1))
          parent = pages('parent-pdfinfo.txt')
          axis = pages('axis-pdfinfo.txt')
          if parent < 146:
              raise SystemExit(f'Parent monograph regressed below 146 pages: {parent}')
          if axis < 100:
              raise SystemExit(f'Critical-axis monograph regressed below 100 pages: {axis}')
          print(f'PAGE GATE PASS: parent={parent}, critical-axis={axis}')
          PYPAGES

          grep -Eq '^Title:[[:space:]]+Metatime' parent-pdfinfo.txt
          grep -Eq '^Author:[[:space:]]+Adrian Lipa' parent-pdfinfo.txt
          qpdf --check "$PARENT" | tee parent-qpdf-check.txt
          qpdf --check "$AXIS" | tee axis-qpdf-check.txt
          sha256sum "$PARENT" "$AXIS" | tee monograph-sha256.txt
          {
            echo "PUBLICATION PREFLIGHT PASS"
            echo "Exact-head checkout: PASS"
            echo "Critical-axis solver/tests: PASS"
            echo "Parent page floor >=146: PASS"
            echo "Critical-axis page floor >=100: PASS"
            echo "Undefined references/citations: 0"
            echo "Overfull boxes: 0"
            echo "RH claim firewall: retained"
          } | tee publication_preflight.txt

      - name: Upload verified monographs and ledgers
        uses: actions/upload-artifact@v4
        with:
          name: tir-half-axis-verified-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            TIR/monograph/metatime_monograph.pdf
            TIR/monograph/metatime_monograph.log
            TIR/monograph/compile-console.log
            TIR/zeta_information_axis/monograph/main.pdf
            TIR/zeta_information_axis/monograph/main.log
            TIR/zeta_information_axis/monograph/compile-console.log
            TIR/zeta_information_axis/reports/numerical_audit.json
            TIR/zeta_information_axis/reports/numerical_audit.md
            TIR/zeta_information_axis/reports/solver_receipt.json
            critical-axis-pytest.log
            solver-console.json
            TIR/monograph/CITATION_COVERAGE_v11_0.md
            TIR/monograph/citation_coverage_v11_0.json
            TIR/monograph/PUBLICATION_READINESS_v11_0.md
            TIR/monograph/publication_readiness_v11_0.json
            checkout_head_sha.txt
            checkout_status.txt
            parent-pdfinfo.txt
            axis-pdfinfo.txt
            parent-qpdf-check.txt
            axis-qpdf-check.txt
            publication_preflight.txt
            monograph-sha256.txt
