name: TIR global 3-manifold smooth certificate

on:
  pull_request:
    paths:
      - 'TIR/foundations/TIR_GLOBAL_3MANIFOLD_SMOOTH_CERTIFICATE_V0_1.md'
      - 'TIR/foundations/validation/tir_global_3manifold_smooth_certificate_v0_1.py'
      - 'TIR/foundations/validation/TIR_GLOBAL_3MANIFOLD_SMOOTH_CERTIFICATE_V0_1.json'
      - '.github/workflows/tir-global-3manifold-smooth-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-global-3manifold-certifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run global 3-manifold / smooth-realization certifier
        run: python TIR/foundations/validation/tir_global_3manifold_smooth_certificate_v0_1.py
