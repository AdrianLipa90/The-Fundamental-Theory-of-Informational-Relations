name: Information-spinor critical-axis

on:
  push:
    paths:
      - 'TIR/zeta_information_axis/**'
      - '.github/workflows/compile-information-spinor-critical-axis.yml'
  pull_request:
    paths:
      - 'TIR/zeta_information_axis/**'
      - '.github/workflows/compile-information-spinor-critical-axis.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TIR/zeta_information_axis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -e .[test]
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-latex-extra texlive-science poppler-utils qpdf
      - name: Run tests
        run: pytest -q
      - name: Generate audit and monograph
        run: make monograph
      - name: Publication preflight
        shell: bash
        run: |
          set -euo pipefail
          qpdf --check monograph/information_spinor_critical_axis.pdf
          pdfinfo monograph/information_spinor_critical_axis.pdf | tee reports/pdfinfo.txt
          pdffonts monograph/information_spinor_critical_axis.pdf | tee reports/pdffonts.txt

          if grep -q "Type 3" reports/pdffonts.txt; then
            echo "FAIL: Type 3 font detected" >&2
            exit 1
          fi

          if grep -q "Overfull" monograph/main.log; then
            echo "FAIL: Overfull box detected" >&2
            grep "Overfull" monograph/main.log >&2 || true
            exit 1
          fi

          if grep -Eiq "undefined references|undefined citations|multiply defined" monograph/main.log; then
            echo "FAIL: unresolved or multiply-defined references detected" >&2
            grep -Ei "undefined references|undefined citations|multiply defined" monograph/main.log >&2 || true
            exit 1
          fi

          echo "CRITICAL-AXIS PUBLICATION PREFLIGHT PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: information-spinor-critical-axis
          path: |
            TIR/zeta_information_axis/monograph/information_spinor_critical_axis.pdf
            TIR/zeta_information_axis/reports/numerical_audit.json
            TIR/zeta_information_axis/reports/numerical_audit.md
            TIR/zeta_information_axis/reports/solver_receipt.json
