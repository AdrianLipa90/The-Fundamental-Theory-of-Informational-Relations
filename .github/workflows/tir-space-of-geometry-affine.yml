name: TIR Space of Geometry affine quantum-point gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-affine-quantum-point-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify checkout provenance
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit quantum-point affine spatial carrier
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/subrepos/the-space-of-geometry/validation/quantum_point_affine_spatial_carrier_v0_1.py | tee quantum_point_affine_spatial_carrier_receipt.json
          grep -Fq '"technical_status": "PASS"' quantum_point_affine_spatial_carrier_receipt.json
          grep -Fq '"promotion_route": "QUANTUM_POINT_AFFINE_DIFFERENCE"' quantum_point_affine_spatial_carrier_receipt.json
          grep -Fq '"local_relation_carrier": "Herm_0(2)~=R3"' quantum_point_affine_spatial_carrier_receipt.json
          grep -Fq '"endpoint_closure_automatic_under_bridge": true' quantum_point_affine_spatial_carrier_receipt.json

      - name: Audit relational state-difference uniqueness
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/subrepos/the-space-of-geometry/validation/relational_state_difference_uniqueness_v0_1.py | tee relational_state_difference_uniqueness_receipt.json
          grep -Fq '"technical_status": "PASS"' relational_state_difference_uniqueness_receipt.json
          grep -Fq '"exact_result": "D(rho_x,rho_y)=lambda*(rho_y-rho_x)"' relational_state_difference_uniqueness_receipt.json
          grep -Fq '"uniqueness": "UP_TO_NONZERO_GLOBAL_SCALE_AND_ORIENTATION"' relational_state_difference_uniqueness_receipt.json
          grep -Fq '"commutant_dimension": 1' relational_state_difference_uniqueness_receipt.json

      - name: Audit affine torsor relation theorem
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/subrepos/the-space-of-geometry/validation/quantum_relation_affine_torsor_v0_1.py | tee quantum_relation_affine_torsor_receipt.json
          grep -Fq '"technical_status": "PASS"' quantum_relation_affine_torsor_receipt.json
          grep -Fq '"exact_result": "AFFINE_ORDERED_PAIR_HAS_UNIQUE_ORIGIN_INDEPENDENT_DISPLACEMENT"' quantum_relation_affine_torsor_receipt.json
          grep -Fq '"canonical_relation": "delta(rho_x,rho_y)=rho_y-rho_x"' quantum_relation_affine_torsor_receipt.json
          grep -Fq '"torsor_displacement_unique": true' quantum_relation_affine_torsor_receipt.json

      - name: Audit A1+A3 intrinsic affine relation
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/subrepos/the-space-of-geometry/validation/a1_a3_intrinsic_affine_relation_v0_1.py | tee a1_a3_intrinsic_affine_relation_receipt.json
          grep -Fq '"technical_status": "PASS"' a1_a3_intrinsic_affine_relation_receipt.json
          grep -Fq '"exact_family": "R(x,y)=c*(y-x)"' a1_a3_intrinsic_affine_relation_receipt.json
          grep -Fq '"uniqueness_status": "EXACT_UNDER_CONTINUOUS_INTRINSIC_AFFINE_NATURALITY"' a1_a3_intrinsic_affine_relation_receipt.json
          grep -Fq '"remaining_tir_gate": "A1_A3_SELECT_INTRINSIC_AFFINE_NATURALITY"' a1_a3_intrinsic_affine_relation_receipt.json

      - name: Audit A1+A3 source-minimality naturality reduction
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/subrepos/the-space-of-geometry/validation/a1_a3_source_minimality_naturality_v0_1.py | tee a1_a3_source_minimality_naturality_receipt.json
          grep -Fq '"technical_status": "PASS"' a1_a3_source_minimality_naturality_receipt.json
          grep -Fq '"exact_result": "SOURCE_MINIMAL_AFFINE_NATURAL_RELATION_IS_c_TIMES_ENDPOINT_DIFFERENCE"' a1_a3_source_minimality_naturality_receipt.json
          grep -Fq '"relation_formula": "R(x,y)=c*(y-x)"' a1_a3_source_minimality_naturality_receipt.json
          grep -Fq '"remaining_tir_gate": "A1_DEPENDENCY_MINIMALITY_APPLIES_TO_PRIMITIVE_LAW_SIGNATURE"' a1_a3_source_minimality_naturality_receipt.json

      - name: Verify v0.5 surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -s TIR/subrepos/the-space-of-geometry/RESEARCH_SPINE_V0_4.md
          test -s TIR/subrepos/the-space-of-geometry/RESEARCH_SPINE_V0_5.md
          test -s TIR/subrepos/the-space-of-geometry/foundations/QUANTUM_POINT_AFFINE_SPATIAL_CARRIER_V0_1.md
          test -s TIR/subrepos/the-space-of-geometry/foundations/RELATIONAL_STATE_DIFFERENCE_UNIQUENESS_V0_1.md
          test -s TIR/subrepos/the-space-of-geometry/foundations/QUANTUM_RELATION_AFFINE_TORSOR_V0_1.md
          test -s TIR/subrepos/the-space-of-geometry/foundations/A1_A3_INTRINSIC_AFFINE_RELATION_V0_1.md
          test -s TIR/subrepos/the-space-of-geometry/foundations/A1_A3_SOURCE_MINIMALITY_NATURALITY_V0_1.md
          test -s TIR/subrepos/the-space-of-geometry/validation/quantum_point_affine_spatial_carrier_v0_1.py
          test -s TIR/subrepos/the-space-of-geometry/validation/relational_state_difference_uniqueness_v0_1.py
          test -s TIR/subrepos/the-space-of-geometry/validation/quantum_relation_affine_torsor_v0_1.py
          test -s TIR/subrepos/the-space-of-geometry/validation/a1_a3_intrinsic_affine_relation_v0_1.py
          test -s TIR/subrepos/the-space-of-geometry/validation/a1_a3_source_minimality_naturality_v0_1.py

      - name: Upload receipts
        uses: actions/upload-artifact@v4
        with:
          name: tir-space-of-geometry-affine-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            quantum_point_affine_spatial_carrier_receipt.json
            relational_state_difference_uniqueness_receipt.json
            quantum_relation_affine_torsor_receipt.json
            a1_a3_intrinsic_affine_relation_receipt.json
            a1_a3_source_minimality_naturality_receipt.json
