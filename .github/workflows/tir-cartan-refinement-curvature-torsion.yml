name: TIR Cartan refinement curvature-torsion gate

on:
  pull_request:
    paths:
      - 'TIR/foundations/TIR_CARTAN_REFINEMENT_CURVATURE_TORSION_SEPARATION_V0_1.md'
      - 'TIR/foundations/validation/tir_cartan_refinement_curvature_torsion_separation_v0_1.py'
      - 'TIR/foundations/validation/TIR_CARTAN_REFINEMENT_CURVATURE_TORSION_SEPARATION_V0_1.json'
      - 'TIR/TIR_COMPLETION_FRONTIER_V0_5.md'
      - '.github/workflows/tir-cartan-refinement-curvature-torsion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cartan-refinement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Cartan refinement curvature-torsion gate
        run: python TIR/foundations/validation/tir_cartan_refinement_curvature_torsion_separation_v0_1.py
