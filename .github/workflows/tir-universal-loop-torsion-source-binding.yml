name: TIR Universal-Loop torsion source-binding gate

on:
  pull_request:
    paths:
      - 'TIR/foundations/TIR_UNIVERSAL_LOOP_TORSION_SOURCE_BINDING_V0_1.md'
      - 'TIR/foundations/validation/tir_universal_loop_torsion_source_binding_v0_1.py'
      - '.github/workflows/tir-universal-loop-torsion-source-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-universal-loop-torsion-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Universal-Loop torsion source-binding gate
        run: python TIR/foundations/validation/tir_universal_loop_torsion_source_binding_v0_1.py
