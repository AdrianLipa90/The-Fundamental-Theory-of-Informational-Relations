name: TIR coefficient selector composition no-go v0.3

on:
  push:
    paths:
      - 'TIR/foundations/TIR_COEFFICIENT_SELECTOR_COMPOSITION_NOGO_V0_3.md'
      - 'TIR/validation/tir_coefficient_selector_composition_nogo_v0_3.py'
      - '.github/workflows/tir-coefficient-selector-composition-nogo-v03.yml'
      - 'TIR/integration/tir_half_foundation_v0_5_0/action_generator.py'
      - 'TIR/integration/tir_half_foundation_v0_5_0/l_constants.py'
      - 'TIR/foundations/TIR_ACTIVE_SEED_COLLATZ_REACHABILITY_V0_1.md'
      - 'TIR/foundations/TIR_COEFFICIENT_TRANSITION_SELECTOR_PRECEDENCE_FALSIFICATION_V0_2.md'
  pull_request:
    paths:
      - 'TIR/foundations/TIR_COEFFICIENT_SELECTOR_COMPOSITION_NOGO_V0_3.md'
      - 'TIR/validation/tir_coefficient_selector_composition_nogo_v0_3.py'
      - '.github/workflows/tir-coefficient-selector-composition-nogo-v03.yml'
      - 'TIR/integration/tir_half_foundation_v0_5_0/action_generator.py'
      - 'TIR/integration/tir_half_foundation_v0_5_0/l_constants.py'
      - 'TIR/foundations/TIR_ACTIVE_SEED_COLLATZ_REACHABILITY_V0_1.md'
      - 'TIR/foundations/TIR_COEFFICIENT_TRANSITION_SELECTOR_PRECEDENCE_FALSIFICATION_V0_2.md'

permissions:
  contents: read

jobs:
  validate-composition-nogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate composition no-go and q-phase compatibility
        run: python TIR/validation/tir_coefficient_selector_composition_nogo_v0_3.py
      - name: Re-run active-seed reachability gate
        run: python TIR/validation/tir_active_seed_collatz_reachability_v0_1.py
      - name: Re-run stopping-length selector falsification
        run: python TIR/validation/tir_coefficient_transition_selector_precedence_falsification_v0_2.py
      - name: Re-run magnitude parent evaluation
        run: python TIR/validation/tir_coefficient_magnitude_parent_evaluation_v0_1.py
