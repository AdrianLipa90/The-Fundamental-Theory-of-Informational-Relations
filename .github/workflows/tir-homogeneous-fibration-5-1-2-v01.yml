name: TIR homogeneous fibration 5|1|2 v0.1

on:
  push:
    paths:
      - 'TIR/foundations/TIR_HOMOGENEOUS_FIBRATION_5_1_2_V0_1.md'
      - 'TIR/validation/tir_homogeneous_fibration_5_1_2_v0_1.py'
      - '.github/workflows/tir-homogeneous-fibration-5-1-2-v01.yml'
      - 'TIR/foundations/TIR_PRINCIPAL_SU2_5_1_2_DECOMPOSITION_V0_1.md'
      - 'TIR/foundations/TIR_CP1_DYADIC_FRACTAL_GATE_V0_1.md'
  pull_request:
    paths:
      - 'TIR/foundations/TIR_HOMOGENEOUS_FIBRATION_5_1_2_V0_1.md'
      - 'TIR/validation/tir_homogeneous_fibration_5_1_2_v0_1.py'
      - '.github/workflows/tir-homogeneous-fibration-5-1-2-v01.yml'
      - 'TIR/foundations/TIR_PRINCIPAL_SU2_5_1_2_DECOMPOSITION_V0_1.md'
      - 'TIR/foundations/TIR_CP1_DYADIC_FRACTAL_GATE_V0_1.md'
  workflow_dispatch:

jobs:
  validate-homogeneous-fibration-5-1-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Validate homogeneous 5|1|2 fibration theorem
        run: python TIR/validation/tir_homogeneous_fibration_5_1_2_v0_1.py
      - name: Re-run principal SU2 5|1|2 validator
        run: python TIR/validation/tir_principal_su2_5_1_2_v0_1.py
      - name: Re-run CP1 golden-mean fractal validator
        run: python TIR/validation/tir_cp1_dyadic_fractal_gate_v0_1.py
