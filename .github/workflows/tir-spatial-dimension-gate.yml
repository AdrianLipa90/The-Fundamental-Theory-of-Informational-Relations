name: TIR spatial dimension gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-spatial-dimension-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify checkout provenance
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit conditional dimension routes
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/validation/tir_spatial_dimension_gate_v0_1.py | tee tir_spatial_dimension_gate_receipt.json
          grep -q '"technical_status": "PASS"' tir_spatial_dimension_gate_receipt.json
          grep -q '"conditional_dimension": 3' tir_spatial_dimension_gate_receipt.json
          grep -q '"routes_converge": true' tir_spatial_dimension_gate_receipt.json
          grep -q '"unconditional_dimension_derived": false' tir_spatial_dimension_gate_receipt.json
          grep -q '"generic_tetrahedral_sample_gram_rank": 3' tir_spatial_dimension_gate_receipt.json
          grep -q '"planar_control_gram_rank": 2' tir_spatial_dimension_gate_receipt.json

      - name: Audit relational generator space
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/validation/tir_relational_generator_space_v0_1.py | tee tir_relational_generator_space_receipt.json
          grep -q '"technical_status": "PASS"' tir_relational_generator_space_receipt.json
          grep -q '"herm0_2_real_dimension": 3' tir_relational_generator_space_receipt.json
          grep -q '"conditional_spatial_dimension": 3' tir_relational_generator_space_receipt.json
          grep -q '"spatial_promotion_gate_open": true' tir_relational_generator_space_receipt.json

      - name: Audit spatial bundle and connection precursor
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/validation/tir_spatial_bundle_connection_v0_1.py | tee tir_spatial_bundle_connection_receipt.json
          grep -q '"technical_status": "PASS"' tir_spatial_bundle_connection_receipt.json
          grep -q '"rank": 3' tir_spatial_bundle_connection_receipt.json
          grep -q '"structure_group": "SO(3)"' tir_spatial_bundle_connection_receipt.json
          grep -q '"double_cover_group": "SU(2)"' tir_spatial_bundle_connection_receipt.json
          grep -q '"tangent_bundle_promotion_open": true' tir_spatial_bundle_connection_receipt.json
          grep -q '"solder_form_derivation_open": true' tir_spatial_bundle_connection_receipt.json

      - name: Audit discrete relational solder form
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/validation/tir_discrete_solder_form_v0_1.py | tee tir_discrete_solder_form_receipt.json
          grep -q '"technical_status": "PASS"' tir_discrete_solder_form_receipt.json
          grep -q '"internal_generator_space": "Herm_0(2)"' tir_discrete_solder_form_receipt.json
          grep -q '"max_local_rank": 3' tir_discrete_solder_form_receipt.json
          grep -q '"continuum_limit_open": true' tir_discrete_solder_form_receipt.json
          grep -q '"torsion_free_selection_open": true' tir_discrete_solder_form_receipt.json
          grep -q '"full_local_rank": 3' tir_discrete_solder_form_receipt.json
          grep -q '"planar_control_rank": 2' tir_discrete_solder_form_receipt.json

      - name: Audit rank-3 isotropy stabilization
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/validation/tir_rank3_isotropy_stabilization_v0_1.py | tee tir_rank3_isotropy_stabilization_receipt.json
          grep -q '"technical_status": "PASS"' tir_rank3_isotropy_stabilization_receipt.json
          grep -q '"conditional_result": "NONZERO_FULL_SO3_INVARIANT_LOCAL_EDGE_SPAN_HAS_RANK_3"' tir_rank3_isotropy_stabilization_receipt.json
          grep -q '"rank3_under_declared_isotropy": true' tir_rank3_isotropy_stabilization_receipt.json
          grep -q '"unconditional_spatial_rank_derived": false' tir_rank3_isotropy_stabilization_receipt.json

      - name: Audit relational endpoint closure
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/validation/tir_relational_endpoint_closure_v0_1.py | tee tir_relational_endpoint_closure_receipt.json
          grep -q '"technical_status": "PASS"' tir_relational_endpoint_closure_receipt.json
          grep -q '"exact_discrete_result": "ENDPOINT_DEFECT_ZERO_IFF_TRIANGULAR_TORSION_DEFECT_ZERO"' tir_relational_endpoint_closure_receipt.json
          grep -q '"a8_status": "CLOSURE_LAW_CANDIDATE"' tir_relational_endpoint_closure_receipt.json
          grep -q '"regular_continuum_limit_derived": false' tir_relational_endpoint_closure_receipt.json

      - name: Audit minimal isotropic tetrahedral cell
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/validation/tir_minimal_isotropic_tetrahedral_cell_v0_1.py | tee tir_minimal_isotropic_tetrahedral_cell_receipt.json
          grep -q '"technical_status": "PASS"' tir_minimal_isotropic_tetrahedral_cell_receipt.json
          grep -q '"conditional_result": "MINIMAL_ZERO_MEAN_FULL_SECOND_MOMENT_ISOTROPY_CELL_IS_TETRAHEDRAL"' tir_minimal_isotropic_tetrahedral_cell_receipt.json
          grep -q '"minimal_valence": 4' tir_minimal_isotropic_tetrahedral_cell_receipt.json
          grep -q '"local_rank": 3' tir_minimal_isotropic_tetrahedral_cell_receipt.json
          grep -q '"normalized_pairwise_dot": "-1/3"' tir_minimal_isotropic_tetrahedral_cell_receipt.json
          grep -q '"continuum_gluing_derived": false' tir_minimal_isotropic_tetrahedral_cell_receipt.json

      - name: Upload receipts
        uses: actions/upload-artifact@v4
        with:
          name: tir-spatial-dimension-gate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            tir_spatial_dimension_gate_receipt.json
            tir_relational_generator_space_receipt.json
            tir_spatial_bundle_connection_receipt.json
            tir_discrete_solder_form_receipt.json
            tir_rank3_isotropy_stabilization_receipt.json
            tir_relational_endpoint_closure_receipt.json
            tir_minimal_isotropic_tetrahedral_cell_receipt.json
