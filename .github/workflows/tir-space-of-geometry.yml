name: TIR The Space of Geometry

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-space-of-geometry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify checkout provenance
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit Space of Geometry v0.10 hardened spine
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/subrepos/the-space-of-geometry/validation/space_of_geometry_spine_v0_10.py | tee space_of_geometry_spine_v0_10_receipt.json
          grep -Fq '"technical_status": "PASS"' space_of_geometry_spine_v0_10_receipt.json
          grep -Fq '"dependency_shape": "COMMON_CARRIER_THEN_EUCLIDEAN_PHYSICAL_REALIZABILITY_AND_FINITE_CELL_OUTPUTS"' space_of_geometry_spine_v0_10_receipt.json
          grep -Fq '"carrier_real_dimension": 3' space_of_geometry_spine_v0_10_receipt.json
          grep -Fq '"physical_single_edge_radius": 2' space_of_geometry_spine_v0_10_receipt.json
          grep -Fq '"physical_pythagorean_realization": "EXPLICIT_NONEMPTY_FAMILY"' space_of_geometry_spine_v0_10_receipt.json
          grep -Fq '"tetrahedron_required_for_pythagoras": false' space_of_geometry_spine_v0_10_receipt.json
          grep -Fq '"tetrahedron_role": "MINIMAL_FINITE_FULL_DIMENSIONAL_CELL"' space_of_geometry_spine_v0_10_receipt.json
          grep -Fq '"sic_role": "INDEPENDENT_CONVERGENCE_CROSSCHECK"' space_of_geometry_spine_v0_10_receipt.json
          grep -Fq '"global_refinement": "DOWNSTREAM_GEOMETRY_PROGRAMME"' space_of_geometry_spine_v0_10_receipt.json

      - name: Audit canonical spatial relation extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/subrepos/the-space-of-geometry/validation/canonical_spatial_relation_extraction_v0_1.py | tee canonical_spatial_relation_extraction_receipt.json
          grep -Fq '"technical_status": "PASS"' canonical_spatial_relation_extraction_receipt.json
          grep -Fq '"exact_result": "UNIQUE_ENDPOINT_CARRYING_AFFINE_DISPLACEMENT"' canonical_spatial_relation_extraction_receipt.json
          grep -Fq '"local_relation_carrier": "Herm_0(2)~=R3"' canonical_spatial_relation_extraction_receipt.json
          grep -Fq '"spatial_relation_status": "CANONICAL_BRANCH_CONSTRUCTION"' canonical_spatial_relation_extraction_receipt.json

      - name: Audit physical relation chord realizability
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/subrepos/the-space-of-geometry/validation/physical_relation_chord_realizability_v0_1.py | tee physical_relation_chord_realizability_receipt.json
          grep -Fq '"technical_status": "PASS"' physical_relation_chord_realizability_receipt.json
          grep -Fq '"exact_theorem": "PHYSICAL_RELATION_CHORD_SET_IS_RADIUS_TWO_BALL"' physical_relation_chord_realizability_receipt.json
          grep -Fq '"reachable_coefficient_domain": "|d|<=2"' physical_relation_chord_realizability_receipt.json
          grep -Fq '"normalized_certificate": "3/5,4/5,1"' physical_relation_chord_realizability_receipt.json
          grep -Fq '"carrier_span": "Herm_0(2)~=R3"' physical_relation_chord_realizability_receipt.json

      - name: Audit A5+A7 simplex edge-orbit regularity
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/subrepos/the-space-of-geometry/validation/a5_a7_simplex_edge_orbit_regularity_v0_1.py | tee a5_a7_simplex_edge_orbit_regularity_receipt.json
          grep -Fq '"technical_status": "PASS"' a5_a7_simplex_edge_orbit_regularity_receipt.json
          grep -Fq '"abstract_simplex_automorphism_group": "S4"' a5_a7_simplex_edge_orbit_regularity_receipt.json
          grep -Fq '"edge_orbit_size": 6' a5_a7_simplex_edge_orbit_regularity_receipt.json
          grep -Fq '"regularity_gate_status": "CLOSED_BY_EXISTING_A5_A7_CROSSWALK"' a5_a7_simplex_edge_orbit_regularity_receipt.json
          grep -Fq '"normalized_pairwise_dot": "-1/3"' a5_a7_simplex_edge_orbit_regularity_receipt.json

      - name: Audit representation-theoretic 3D crosscheck
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/subrepos/the-space-of-geometry/validation/spatial_promotion_uniqueness_v0_1.py | tee spatial_promotion_uniqueness_receipt.json
          grep -Fq '"technical_status": "PASS"' spatial_promotion_uniqueness_receipt.json
          grep -Fq '"minimal_faithful_real_dimension": 3' spatial_promotion_uniqueness_receipt.json

      - name: Audit unlabeled simplex automorphism crosscheck
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/subrepos/the-space-of-geometry/validation/unlabeled_simplex_automorphism_regularity_v0_1.py | tee unlabeled_simplex_automorphism_regularity_receipt.json
          grep -Fq '"technical_status": "PASS"' unlabeled_simplex_automorphism_regularity_receipt.json
          grep -Fq '"abstract_simplex_automorphism_group": "S4"' unlabeled_simplex_automorphism_regularity_receipt.json
          grep -Fq '"oriented_automorphism_group": "A4"' unlabeled_simplex_automorphism_regularity_receipt.json
          grep -Fq '"edge_orbit_size": 6' unlabeled_simplex_automorphism_regularity_receipt.json

      - name: Audit local Euclidean and Pythagorean closure
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/subrepos/the-space-of-geometry/validation/local_euclidean_pythagorean_closure_v0_1.py | tee local_euclidean_pythagorean_receipt.json
          grep -Fq '"technical_status": "PASS"' local_euclidean_pythagorean_receipt.json
          grep -Fq '"endpoint": "PYTHAGOREAN_CLOSURE"' local_euclidean_pythagorean_receipt.json

      - name: Audit publication proof dependency DAG v0.2
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/subrepos/the-space-of-geometry/validation/publication_proof_dependency_audit_v0_2.py | tee publication_proof_dependency_v0_2_receipt.json
          grep -Fq '"technical_status": "PASS"' publication_proof_dependency_v0_2_receipt.json
          grep -Fq '"publication_verdict": "PASS_LOCAL_DEPENDENCY_GRAPH_AND_PHYSICAL_REALIZABILITY"' publication_proof_dependency_v0_2_receipt.json
          grep -Fq '"acyclic": true' publication_proof_dependency_v0_2_receipt.json
          grep -Fq '"physical_realizability_chain_complete": true' publication_proof_dependency_v0_2_receipt.json
          grep -Fq '"tetrahedron_required_for_pythagoras": false' publication_proof_dependency_v0_2_receipt.json
          grep -Fq '"tetrahedron_required_for_physical_pythagoras": false' publication_proof_dependency_v0_2_receipt.json
          grep -Fq '"sic_is_premise_of_main_endpoints": false' publication_proof_dependency_v0_2_receipt.json
          grep -Fq '"all_required_surfaces_present": true' publication_proof_dependency_v0_2_receipt.json

      - name: Verify current subrepo surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -s TIR/subrepos/the-space-of-geometry/README.md
          test -s TIR/subrepos/the-space-of-geometry/RESEARCH_SPINE_V0_10.md
          test -s TIR/subrepos/the-space-of-geometry/foundations/CANONICAL_SPATIAL_RELATION_EXTRACTION_V0_1.md
          test -s TIR/subrepos/the-space-of-geometry/foundations/PHYSICAL_RELATION_CHORD_REALIZABILITY_V0_1.md
          test -s TIR/subrepos/the-space-of-geometry/foundations/A5_A7_SIMPLEX_EDGE_ORBIT_REGULARITY_V0_1.md
          test -s TIR/subrepos/the-space-of-geometry/foundations/UNLABELED_SIMPLEX_AUTOMORPHISM_REGULARITY_V0_1.md
          test -s TIR/subrepos/the-space-of-geometry/foundations/LOCAL_EUCLIDEAN_PYTHAGOREAN_CLOSURE_V0_1.md
          test -s TIR/subrepos/the-space-of-geometry/publication/PROOF_DEPENDENCY_AUDIT_V0_2.md
          test -s TIR/subrepos/the-space-of-geometry/validation/space_of_geometry_spine_v0_10.py
          test -s TIR/subrepos/the-space-of-geometry/validation/physical_relation_chord_realizability_v0_1.py
          test -s TIR/subrepos/the-space-of-geometry/validation/publication_proof_dependency_audit_v0_2.py
          test -s TIR/subrepos/the-space-of-geometry/paper/MANUSCRIPT_V0_2.md
          test -s TIR/subrepos/the-space-of-geometry/paper/THE_SPACE_OF_GEOMETRY_V1_0.tex

      - name: Upload receipts
        uses: actions/upload-artifact@v4
        with:
          name: tir-space-of-geometry-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            space_of_geometry_spine_v0_10_receipt.json
            canonical_spatial_relation_extraction_receipt.json
            physical_relation_chord_realizability_receipt.json
            a5_a7_simplex_edge_orbit_regularity_receipt.json
            spatial_promotion_uniqueness_receipt.json
            unlabeled_simplex_automorphism_regularity_receipt.json
            local_euclidean_pythagorean_receipt.json
            publication_proof_dependency_v0_2_receipt.json
