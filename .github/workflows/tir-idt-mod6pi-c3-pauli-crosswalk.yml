name: TIR IDT mod6pi C3 Pauli crosswalk

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod6pi-c3-pauli-crosswalk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact PR head and clean diff
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run mod6pi C3 Pauli representation validator
        run: |
          set -euo pipefail
          python3 TIR/validation/tir_idt_mod6pi_c3_pauli_crosswalk_v0_1.py > mod6pi-c3-pauli-receipt.json
          grep -Fq '"technical_status": "PASS"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"representation_status": "TEMPORAL_C3_TO_PAULI_AND_ORDERED_FAMILY_C3_CROSSWALK_CLOSED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"temporal_family_label_binding": "ANCHORED_EQUIVARIANT_LABEL_INTERTWINER_CLOSED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"flavour_cardinality_result": "N_F_EQUALS_3_CONDITIONAL_ON_PHYSICAL_TEMPORAL_FAMILY_BINDING"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"cp_character_transfer": "F3_JARLSKOG_MATH_TRANSFER_CLOSED_PHYSICAL_CP_BINDING_OPEN"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"su3f_transfer": "LIE_DIMENSION_8_PRESERVED_UNDER_ORDERED_INTERTWINER"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"six_state_product_binding": "C3_X_CHIRALITY_Z2_SIX_STATE_INTERTWINER_CLOSED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"six_quark_flavour_status": "OPEN_REQUIRES_CHIRALITY_Z2_TO_WEAK_ISOSPIN_DOUBLET_BINDING"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"physical_sector_binding": "OPEN"' mod6pi-c3-pauli-receipt.json

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: tir-idt-mod6pi-c3-pauli-${{ github.event.pull_request.head.sha || github.sha }}
          path: mod6pi-c3-pauli-receipt.json
