name: TIR IDT mod6pi C3 Pauli crosswalk

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod6pi-c3-pauli-crosswalk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact PR head and clean diff
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run mod6pi C3 Pauli representation validator
        run: |
          set -euo pipefail
          python3 TIR/validation/tir_idt_mod6pi_c3_pauli_crosswalk_v0_1.py | tee mod6pi-c3-pauli-receipt.json
          grep -Fq '"technical_status": "PASS"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"representation_status": "TEMPORAL_C3_TO_PAULI_AND_ORDERED_FAMILY_C3_CROSSWALK_CLOSED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"temporal_family_label_binding": "ANCHORED_EQUIVARIANT_LABEL_INTERTWINER_CLOSED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"family_precedence_binding": "TEMPORAL_C3_TO_ACTIVE_STAGE22_FAMILY_SEED_ORDER_CLOSED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"independent_family_multiplicity_status": "STAGE21_E8_THREEFOLD_MULTIPLICITY_3_CURRENT_PASS"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"seed_exceptional_triplet_binding_status": "STAGE24_ORDERED_SEED_TO_E8_TRIPLET_INTERTWINER_CURRENT_PASS"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"temporal_c3_family_role": "INDEPENDENT_C3_CROSSWALK_TO_EXISTING_MULTIPLICITY3_FAMILY_CARRIER"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"raw_product_seed_cycle_status": "ORDINARY_PRODUCT_SEED_COLLATZ_C3_CYCLE_REFUTED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"distance_amplitude_status": "CANONICAL_PATH_COST_TO_AMPLITUDE_RULE_NOT_FOUND"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"oriented_family_generator_status": "TEMPORAL_ORIENTATION_SELECTS_P3_VS_INVERSE_AT_REPRESENTATION_LEVEL"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"icosahedral_family_embedding_status": "STAGE61_62_C3_COMPATIBLE_RIGID_EMBEDDING_CURRENT_PASS"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"seed_dynamical_cycle_status": "OPEN_RICHER_POINCARE_HOLONOMY_OPERATOR_REQUIRED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"collatz_poincare_operator_chain_status": "BRANCH_WORD_TO_PSL2R_TO_SYM2_THREE_CARRIER_CURRENT_EXACT"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"binary_to_three_carrier_status": "SYM2_TWO_TO_THREE_CARRIER_CLOSED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"split_real_to_family_unitary_status": "DIRECT_UNITARIZATION_REFUTED__COMPACT_SU3F_ENDPOINT_REQUIRED__BRANCHWISE_REALFORM_LIFT_OPEN"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"spin1_cp_status": "COMPACT_SPIN1_SUBGROUP_JARLSKOG_ZERO_FULL_SU3_COMPLEMENT_REQUIRED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"su3_so3_complement_status": "FIVE_DIMENSIONAL_SU3_OVER_SO3_SPIN2_COMPLEMENT_CURRENT_EXACT"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"n5_icosahedral_complement_status": "N5_A5_IRREDUCIBLE_FIVE_CARRIER_CURRENT_EXACT"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"icosahedral_su3_generation_status": "SIX_ICOSAHEDRAL_QUADRUPOLES_GENERATE_FULL_SU3_CURRENT_EXACT"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"cubic_complement_selector_status": "STAGE66_UNIQUE_STATIONARY_CUBIC_SELECTOR_CLOSED_SADDLE"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"cubic_complement_selector_eta_exact": "-75*(59+21*sqrt(5))/638"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"branch_symbol_split_real_operator_status": "BRANCH_SYMBOL_TO_SPLIT_REAL_THREE_OPERATOR_CLOSED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"legacy_rhythm_status": "LEGACY_BOUNDED_RHYTHM_MODEL_CHOICE_NOT_PROMOTED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"poincare_branch_translation_length_status": "POINCARE_BRANCH_TRANSLATION_LENGTH_ALPHABET_CLOSED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"branch_scale_cocycle_status": "SIGNED_LOG_JACOBIAN_COCYCLE_CLOSED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"geometric_rhythm_alphabet_status": "CANONICAL_GEOMETRIC_RHYTHM_ALPHABET_AVAILABLE"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"exact_rhythm_status": "EXACT_GEOMETRIC_BRANCH_LENGTH_ALPHABET_CLOSED__HAMILTONIAN_RHO_BINDING_OPEN"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"family_endpoint_class_status": "CURRENT_FAMILY_ENDPOINT_COMPACT_SU3F_REQUIRED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"real_form_endpoint_status": "COMPACT_ENDPOINT_CLASS_FIXED__DYNAMICAL_BRANCHWISE_LIFT_OPEN"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"canonical_polar_compactification_status": "CANONICAL_POLAR_COMPACTIFICATION_REFUTED_AS_SUFFICIENT_BRANCH_LIFT"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"complex_holonomy_cp_mechanism_status": "NONPOLAR_COMPLEX_HOLONOMY_CP_MECHANISM_EXISTS_SOURCE_QUARANTINED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"scalar_qc_cp_status": "SCALAR_VERTEX_QC_PHASE_DIFFERENCE_CP_NO_GO"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"cp_phase_source_requirement": "NONSEPARABLE_PAIR_DEPENDENT_HOLONOMY_REQUIRED_FOR_NONZERO_PLAQUETTE_PHASE"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"equatorial_qc_bargmann_status": "ACTIVE_SCALAR_QC_EQUATORIAL_BARGMANN_PHASE_ZERO"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"overlap_bargmann_crosswalk_status": "PLAQUETTE_PHASE_EQUALS_BARGMANN_QUADRILATERAL_UNDER_OVERLAP_REALIZATION"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"projective_holonomy_source_status": "OVERLAP_REALIZATION_CONDITIONAL__SOURCE_STATES_NOT_YET_DERIVED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"geometric_cp_source_requirement": "ADDITIONAL_NONSEPARABLE_CONNECTION_OR_NON_EQUATORIAL_MULTI_RAY_GEOMETRY_REQUIRED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"branch_to_complex_holonomy_status": "OPEN_CLEAN_NONSEPARABLE_COLLATZ_POINCARE_TO_COMPLEX_FAMILY_HOLONOMY_MAP"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"stage39_40_status": "TWO_OPERATOR_MECHANISM_RETAINED_FULL_CKM_SHAPE_FAIL"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"continuous_real_lie_lift_status": "NONTRIVIAL_CONTINUOUS_PSL2R_TO_SU3F_LIE_HOMOMORPHIC_LIFT_REFUTED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"compact_family_branch_operator_status": "OPEN_DISCRETE_OR_HOLONOMIC_NONPOLAR_BRANCHWISE_SU3F_LIFT"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"family_dynamics_selector_status": "CUBIC_SELECTOR_CLOSED__SPLIT_REAL_BRANCH_OPERATOR_CLOSED__GEOMETRIC_RHYTHM_ALPHABET_CLOSED__COMPACT_ENDPOINT_FIXED__POLAR_AND_CONTINUOUS_LIE_LIFTS_REFUTED__SCALAR_QC_SEPARABLE_AND_EQUATORIAL_BARGMANN_CP_REFUTED__COMPLEX_HOLONOMY_EXISTS__RHO_BINDING_AND_NONSEPARABLE_DISCRETE_HOLONOMIC_BRANCH_MAP_OPEN"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"historical_generation_numbering_status": "PRESERVED_BUT_NOT_USED_AS_ACTIVE_C3_ANCHOR"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"source_order_anchor_status": "UNIQUE_ORDER_PRESERVING_LABEL_CROSSWALK_CLOSED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"declared_anchor_dependency": "REMOVED_AT_ORDERED_LABEL_REPRESENTATION_LEVEL"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"raw_qc_phase_binding": "DIRECT_UNIFORM_C3_CLOCK_IDENTIFICATION_REFUTED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"flavour_cardinality_result": "N_F_EQUALS_3_CONDITIONAL_ON_PHYSICAL_TEMPORAL_FAMILY_BINDING"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"cp_character_transfer": "F3_JARLSKOG_MATH_TRANSFER_CLOSED_PHYSICAL_CP_BINDING_OPEN"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"su3f_transfer": "LIE_DIMENSION_8_PRESERVED_UNDER_ORDERED_INTERTWINER"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"six_state_product_binding": "C3_X_CHIRALITY_Z2_SIX_STATE_INTERTWINER_CLOSED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"weak_family_cardinality": "DIMENSION_3_X_2_EQUALS_6_CONDITIONAL_ON_PHYSICAL_TEMPORAL_FAMILY_BINDING"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"six_quark_flavour_cardinality": "CONDITIONAL_LABEL_COUNT_SIX_NOT_FULL_PHYSICAL_SPECTRUM_DERIVATION"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"legacy_weak_pole_orientation_audit": "ARCHIVAL_SOURCE_RECOVERED_CURRENT_PROMOTION_CONDITIONAL"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"legacy_generated_projection_csv_state": "CORRECTED_UP_QUARK_PARTICLE_ID"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"legacy_generated_projection_csv_up_quark_particle_ids": [' mod6pi-c3-pauli-receipt.json
          grep -Fq '"chirality_to_weak_label_intertwiner": "CLOSED_CONDITIONAL_ON_RECOVERED_NORTH_SOUTH_T3_ORIENTATION_ANCHOR"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"six_cycle_weak_family_label_operator": "CLOSED_CONDITIONAL_ON_RECOVERED_WEAK_ORIENTATION_ANCHOR"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"weak_a1_weyl_z2_status": "CURRENT_EXACT"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"weak_axis_conjugacy_status": "A1_CARTAN_ORIENTATION_SU2_CONJUGACY_CLASS_CLOSED"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"electroweak_vacuum_alignment_status": "OPEN_HIGGS_HYPERCHARGE_ALIGNMENT_NOT_CLOSED_BY_AXIS_CONJUGACY"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"family_x_weak_six_cycle": "CURRENT_C3_X_A1_WEYL_Z2_C6_EXACT"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"six_weak_component_label_count": "SIX_CONDITIONAL_ON_PHYSICAL_TEMPORAL_FAMILY_BINDING"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"six_cycle_physical_flavour_operator": "CURRENT_WEAK_FAMILY_REPRESENTATION_EXACT_PHYSICAL_GENERATION_BINDING_OPEN"' mod6pi-c3-pauli-receipt.json
          grep -Fq '"physical_sector_binding": "OPEN"' mod6pi-c3-pauli-receipt.json

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: tir-idt-mod6pi-c3-pauli-${{ github.event.pull_request.head.sha || github.sha }}
          path: mod6pi-c3-pauli-receipt.json
