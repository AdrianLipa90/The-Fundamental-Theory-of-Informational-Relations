name: TIR integrated kappa and critical-axis verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-integrated-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify checkout provenance
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git rev-parse HEAD | tee checkout_head_sha.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify TIR structural contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/validation/kappa_phase_rate_identity_v11_1.py | tee kappa_phase_rate_receipt.json
          python3 TIR/validation/tir_kappa_flavour_mixing_normalization_v0_1.py | tee kappa_flavour_mixing_normalization_receipt.json
          python3 TIR/validation/review_source_contract_v11_1.py | tee review_source_contract_receipt.json
          python3 TIR/validation/tir_relational_half_seam_v0_1.py | tee tir_relational_half_seam_receipt.json
          python3 TIR/validation/tir_zero_first_distinction_v0_1.py | tee tir_zero_first_distinction_receipt.json
          python3 TIR/validation/tir_axiomatic_kernel_v0_1.py | tee tir_axiomatic_kernel_receipt.json
          python3 TIR/validation/tir_first_distinction_theorem_v0_1.py | tee tir_first_distinction_theorem_receipt.json
          python3 TIR/validation/tir_half_seam_phase_fiber_v0_1.py | tee tir_half_seam_phase_fiber_receipt.json
          python3 TIR/validation/tir_causal_bridge_from_zero_v0_1.py | tee tir_causal_bridge_from_zero_receipt.json
          python3 TIR/validation/tir_spatial_geometry_core_v0_1.py | tee tir_spatial_geometry_core_receipt.json
          grep -Fq '"technical_status": "PASS"' kappa_phase_rate_receipt.json
          grep -Fq '"technical_status": "PASS"' kappa_flavour_mixing_normalization_receipt.json
          grep -Fq '"mixing_algebra_dimension": 8' kappa_flavour_mixing_normalization_receipt.json
          grep -Fq '"flavour_multiplicity": 3' kappa_flavour_mixing_normalization_receipt.json
          grep -Fq '"mixing_channel_count": 24' kappa_flavour_mixing_normalization_receipt.json
          grep -Fq '"total_mixing_phase_measure": "24*pi"' kappa_flavour_mixing_normalization_receipt.json
          grep -Fq '"kappa": "ln2/(24*pi)"' kappa_flavour_mixing_normalization_receipt.json
          grep -Fq '"technical_status": "PASS"' review_source_contract_receipt.json
          grep -Fq '"technical_status": "PASS"' tir_relational_half_seam_receipt.json
          grep -Fq '"technical_status": "PASS"' tir_zero_first_distinction_receipt.json
          grep -Fq '"technical_status": "PASS"' tir_axiomatic_kernel_receipt.json
          grep -Fq '"technical_status": "PASS"' tir_first_distinction_theorem_receipt.json
          grep -Fq '"technical_status": "PASS"' tir_half_seam_phase_fiber_receipt.json
          grep -Fq '"technical_status": "PASS"' tir_causal_bridge_from_zero_receipt.json
          grep -Fq '"technical_status": "PASS"' tir_spatial_geometry_core_receipt.json
          grep -Fq '"pi_cancelled_exactly": true' kappa_phase_rate_receipt.json
          grep -Fq '"seam_is_positive_reciprocal_fixed_point": true' tir_relational_half_seam_receipt.json
          grep -Fq '"equal_weight_seam": true' tir_relational_half_seam_receipt.json
          grep -Fq '"noncommuting_distinction_axes": true' tir_zero_first_distinction_receipt.json
          grep -Fq '"distinct_axis_rotations_noncommute": true' tir_zero_first_distinction_receipt.json
          grep -Fq '"axiom_count": 8' tir_axiomatic_kernel_receipt.json
          grep -Fq '"next_gate": "RELATIVE_PHASE_LAW"' tir_first_distinction_theorem_receipt.json
          grep -Fq '"next_gate": "HALF_FIBER_PHASE_RATE_SELECTION"' tir_half_seam_phase_fiber_receipt.json
          grep -Fq '"no_temporal_circularity": true' tir_causal_bridge_from_zero_receipt.json
          grep -Fq '"sibling_parent_pass": true' tir_causal_bridge_from_zero_receipt.json
          grep -Fq '"tir_spatial_ownership_pass": true' tir_causal_bridge_from_zero_receipt.json
          grep -Fq '"spacetime_join_parent_pass": true' tir_causal_bridge_from_zero_receipt.json
          grep -Fq '"matter_join_parent_pass": true' tir_causal_bridge_from_zero_receipt.json
          grep -Fq '"tir_owns_spatial_geometry": true' tir_spatial_geometry_core_receipt.json
          grep -Fq '"lorentzian_block_signature": true' tir_spatial_geometry_core_receipt.json
          grep -Fq '"sphere_types_separate_until_explicit_identification_map": true' tir_spatial_geometry_core_receipt.json

      - name: Verify critical-axis solver
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "TIR/zeta_information_axis[test]"
          pytest TIR/zeta_information_axis/tests -q | tee critical-axis-pytest.log
          python TIR/zeta_information_axis/scripts/run_audit.py
          python TIR/zeta_information_axis/scripts/solve_axis.py --output TIR/zeta_information_axis/reports/solver_receipt.json > solver-console.json
          grep -Fq '"half_axis_consensus": true' TIR/zeta_information_axis/reports/solver_receipt.json
          grep -Fq '"riemann_hypothesis_in_closure": false' TIR/zeta_information_axis/reports/solver_receipt.json

      - name: Prepare publication sources and crosswalk audit
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/monograph/normalize_build_sources.py
          PYTHONDONTWRITEBYTECODE=1 python3 TIR/monograph/prepare_publication_candidate_v11_0.py
          PYTHONDONTWRITEBYTECODE=1 python3 TIR/monograph/sync_current_tir_publication_surfaces.py
          PYTHONDONTWRITEBYTECODE=1 python3 TIR/monograph/apply_kappa_phase_rate_patch.py
          PYTHONDONTWRITEBYTECODE=1 python3 TIR/apply_metatime_paper_review_patch.py
          PYTHONDONTWRITEBYTECODE=1 python3 TIR/monograph/add_citation_context_v10_9.py
          PYTHONDONTWRITEBYTECODE=1 python3 TIR/monograph/audit_information_spinor_crosswalk.py
          rm -rf TIR/monograph/__pycache__ TIR/validation/__pycache__ TIR/__pycache__
          find TIR/zeta_information_axis -type d -name __pycache__ -prune -exec rm -rf {} + || true
          git diff --check

      - name: Install publication toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk lmodern texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science texlive-publishers texlive-xetex poppler-utils qpdf

      - name: Compile parent monograph
        working-directory: TIR/monograph
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error metatime_monograph.tex

      - name: Compile short Metatime paper
        working-directory: TIR
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error metatime_paper.tex

      - name: Generate and compile critical-axis monograph
        shell: bash
        run: |
          set -euo pipefail
          make -C TIR/zeta_information_axis monograph

      - name: Integrated preflight
        shell: bash
        run: |
          set -euo pipefail
          test -s TIR/monograph/metatime_monograph.pdf
          test -s TIR/metatime_paper.pdf
          test -s TIR/zeta_information_axis/monograph/main.pdf
          test -s TIR/monograph/appendices/appP_secret_half_cross_relation.tex
          test -s TIR/monograph/appendices/appP_information_spinor_crosswalk.tex
          test -s TIR/zeta_information_axis/reports/solver_receipt.json
          test -s TIR/foundations/TIR_KAPPA_FLAVOUR_MIXING_NORMALIZATION_V0_1.md
          test -s TIR/foundations/TIR_AXIOMATIC_KERNEL_V0_1.md
          test -s TIR/foundations/TIR_FIRST_DISTINCTION_THEOREM_V0_1.md
          test -s TIR/foundations/TIR_FIRST_DISTINCTION_THEOREM_V0_2.md
          test -s TIR/foundations/TIR_HALF_SEAM_PHASE_FIBER_V0_1.md
          test -s TIR/foundations/TIR_PRIMITIVE_DEPENDENCY_LATTICE_V0_1.md
          test -s TIR/foundations/TIR_CAUSAL_BRIDGE_FROM_ZERO_V0_1.md
          test -s TIR/foundations/TIR_SPATIAL_GEOMETRY_CORE_V0_1.md
          test -s TIR/foundations/TIR_SPATIAL_TEMPORAL_CLOSURE_INTERFACE_V0_1.md
          qpdf --check TIR/monograph/metatime_monograph.pdf
          qpdf --check TIR/metatime_paper.pdf
          qpdf --check TIR/zeta_information_axis/monograph/main.pdf

          if grep -q "Overfull" TIR/zeta_information_axis/monograph/main.log; then
            echo "FAIL: critical-axis monograph contains Overfull boxes" >&2
            grep "Overfull" TIR/zeta_information_axis/monograph/main.log >&2 || true
            exit 1
          fi

          if grep -Eiq "undefined references|undefined citations|multiply defined" TIR/zeta_information_axis/monograph/main.log; then
            echo "FAIL: critical-axis monograph contains unresolved or multiply-defined references" >&2
            grep -Ei "undefined references|undefined citations|multiply defined" TIR/zeta_information_axis/monograph/main.log >&2 || true
            exit 1
          fi

          echo "INTEGRATED TIR CLOSURE PREFLIGHT PASS" | tee integrated_preflight.txt

      - name: Upload integrated receipts
        uses: actions/upload-artifact@v4
        with:
          name: tir-integrated-verification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            kappa_phase_rate_receipt.json
            kappa_flavour_mixing_normalization_receipt.json
            review_source_contract_receipt.json
            tir_relational_half_seam_receipt.json
            tir_zero_first_distinction_receipt.json
            tir_axiomatic_kernel_receipt.json
            tir_first_distinction_theorem_receipt.json
            tir_half_seam_phase_fiber_receipt.json
            tir_causal_bridge_from_zero_receipt.json
            tir_spatial_geometry_core_receipt.json
            critical-axis-pytest.log
            solver-console.json
            TIR/zeta_information_axis/reports/solver_receipt.json
            TIR/zeta_information_axis/reports/numerical_audit.json
            TIR/monograph/metatime_monograph.pdf
            TIR/metatime_paper.pdf
            TIR/zeta_information_axis/monograph/main.pdf
            integrated_preflight.txt
            checkout_head_sha.txt
