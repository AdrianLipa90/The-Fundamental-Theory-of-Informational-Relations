name: Compile The Space of Geometry

on:
  pull_request:
    branches: [main]
    paths:
      - 'TIR/subrepos/the-space-of-geometry/**'
      - '.github/workflows/compile-space-of-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-publication:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TIR/subrepos/the-space-of-geometry/paper
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify checkout provenance
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-latex-extra texlive-science poppler-utils qpdf

      - name: Run synchronized publication dependency audit
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/subrepos/the-space-of-geometry/validation/publication_proof_dependency_audit_v0_3.py | tee space_of_geometry_publication_dependency_v0_3_receipt.json
          grep -Fq '"technical_status": "PASS"' space_of_geometry_publication_dependency_v0_3_receipt.json
          grep -Fq '"publication_verdict": "PASS_V1_1_SYNCHRONIZED_LOCAL_PROOF_GRAPH"' space_of_geometry_publication_dependency_v0_3_receipt.json
          grep -Fq '"canonical_manuscript": "THE_SPACE_OF_GEOMETRY_V1_1.tex"' space_of_geometry_publication_dependency_v0_3_receipt.json
          grep -Fq '"manuscript_physical_realizability_synchronized": true' space_of_geometry_publication_dependency_v0_3_receipt.json

      - name: Run exact physical realizability audit
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 TIR/subrepos/the-space-of-geometry/validation/physical_relation_chord_realizability_v0_1.py | tee physical_relation_chord_realizability_receipt.json
          grep -Fq '"technical_status": "PASS"' physical_relation_chord_realizability_receipt.json
          grep -Fq '"exact_theorem": "PHYSICAL_RELATION_CHORD_SET_IS_RADIUS_TWO_BALL"' physical_relation_chord_realizability_receipt.json
          grep -Fq '"normalized_certificate": "3/5,4/5,1"' physical_relation_chord_realizability_receipt.json

      - name: Compile publication candidate v1.1
        shell: bash
        run: |
          set -euo pipefail
          latexmk -xelatex -interaction=nonstopmode -halt-on-error THE_SPACE_OF_GEOMETRY_V1_1.tex
          test -s THE_SPACE_OF_GEOMETRY_V1_1.pdf

      - name: PDF structural preflight
        shell: bash
        run: |
          set -euo pipefail
          qpdf --check THE_SPACE_OF_GEOMETRY_V1_1.pdf
          pdfinfo THE_SPACE_OF_GEOMETRY_V1_1.pdf | tee THE_SPACE_OF_GEOMETRY_V1_1.pdfinfo.txt
          pdffonts THE_SPACE_OF_GEOMETRY_V1_1.pdf | tee THE_SPACE_OF_GEOMETRY_V1_1.pdffonts.txt
          ! grep -q 'Type 3' THE_SPACE_OF_GEOMETRY_V1_1.pdffonts.txt
          ! grep -Eiq 'undefined references|undefined citations|multiply defined' THE_SPACE_OF_GEOMETRY_V1_1.log
          ! grep -q 'Overfull \\hbox' THE_SPACE_OF_GEOMETRY_V1_1.log

      - name: Publication receipt
        shell: bash
        run: |
          set -euo pipefail
          PAGES="$(pdfinfo THE_SPACE_OF_GEOMETRY_V1_1.pdf | awk '/^Pages:/ {print $2}')"
          BYTES="$(stat -c '%s' THE_SPACE_OF_GEOMETRY_V1_1.pdf)"
          SHA256="$(sha256sum THE_SPACE_OF_GEOMETRY_V1_1.pdf | awk '{print $1}')"
          printf '{\n  "schema": "TIR_SPACE_OF_GEOMETRY_PUBLICATION_V1_1",\n  "technical_status": "PASS",\n  "source": "THE_SPACE_OF_GEOMETRY_V1_1.tex",\n  "pdf": "THE_SPACE_OF_GEOMETRY_V1_1.pdf",\n  "pages": %s,\n  "bytes": %s,\n  "sha256": "%s",\n  "dependency_verdict": "PASS_V1_1_SYNCHRONIZED_LOCAL_PROOF_GRAPH",\n  "physical_relation_domain": "RADIUS_TWO_BALL",\n  "physical_certificate": "3/5,4/5,1",\n  "endpoint": "PYTHAGOREAN_CLOSURE"\n}\n' "$PAGES" "$BYTES" "$SHA256" | tee THE_SPACE_OF_GEOMETRY_V1_1.receipt.json

      - name: Upload publication artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-space-of-geometry-v1-1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            TIR/subrepos/the-space-of-geometry/paper/THE_SPACE_OF_GEOMETRY_V1_1.pdf
            TIR/subrepos/the-space-of-geometry/paper/THE_SPACE_OF_GEOMETRY_V1_1.receipt.json
            TIR/subrepos/the-space-of-geometry/paper/THE_SPACE_OF_GEOMETRY_V1_1.pdfinfo.txt
            TIR/subrepos/the-space-of-geometry/paper/THE_SPACE_OF_GEOMETRY_V1_1.pdffonts.txt
            space_of_geometry_publication_dependency_v0_3_receipt.json
            physical_relation_chord_realizability_receipt.json
