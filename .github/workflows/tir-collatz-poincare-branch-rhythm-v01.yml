name: TIR Collatz Poincare branch rhythm v0.1

on:
  push:
    paths:
      - 'TIR/frozen_predictions/TIR_COLLATZ_POINCARE_BRANCH_RHYTHM_FREEZE_V0_1.md'
      - 'TIR/validation/tir_collatz_poincare_branch_rhythm_v0_1.py'
      - 'TIR/frozen_predictions/validation/TIR_POLYGONAL_EXCITATION_STAGE48_COLLATZ_BRANCH_WORD_OPERATOR_INTERFACE_V0_1.md'
      - 'TIR/frozen_predictions/validation/TIR_POLYGONAL_EXCITATION_STAGE49_COLLATZ_MOBIUS_POINCARE_LIFT_V0_1.md'
      - '.github/workflows/tir-collatz-poincare-branch-rhythm-v01.yml'
  pull_request:
    paths:
      - 'TIR/frozen_predictions/TIR_COLLATZ_POINCARE_BRANCH_RHYTHM_FREEZE_V0_1.md'
      - 'TIR/validation/tir_collatz_poincare_branch_rhythm_v0_1.py'
      - 'TIR/frozen_predictions/validation/TIR_POLYGONAL_EXCITATION_STAGE48_COLLATZ_BRANCH_WORD_OPERATOR_INTERFACE_V0_1.md'
      - 'TIR/frozen_predictions/validation/TIR_POLYGONAL_EXCITATION_STAGE49_COLLATZ_MOBIUS_POINCARE_LIFT_V0_1.md'
      - '.github/workflows/tir-collatz-poincare-branch-rhythm-v01.yml'

permissions:
  contents: read

jobs:
  validate-branch-rhythm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact PR head and clean diff
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen branch-rhythm candidate
        run: python TIR/validation/tir_collatz_poincare_branch_rhythm_v0_1.py
      - name: Assert candidate-only status
        run: |
          grep -Fq '"status": "PASS_CANDIDATE_MATHEMATICAL_AND_PROVENANCE_VALIDATION__PHYSICAL_RHYTHM_NOT_PROMOTED"' TIR/validation/results/TIR_COLLATZ_POINCARE_BRANCH_RHYTHM_RECEIPT_V0_1.json
          grep -Fq '"physical_rhythm_promoted": false' TIR/validation/results/TIR_COLLATZ_POINCARE_BRANCH_RHYTHM_RECEIPT_V0_1.json
          grep -Fq '"branch_to_family_operator_status": "OPEN"' TIR/validation/results/TIR_COLLATZ_POINCARE_BRANCH_RHYTHM_RECEIPT_V0_1.json
