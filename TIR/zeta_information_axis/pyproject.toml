[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "information-spinor-critical-axis"
version = "0.1.0"
description = "Reproducible mathematics and numerical audits for the information-spinor critical-axis hypothesis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mpmath>=1.3", "numpy>=2.0", "matplotlib>=3.8"]
license = {text = "AGPL-3.0-or-later for code; see LICENSES.md"}
authors = [{name = "Adrian Lipa"}]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
